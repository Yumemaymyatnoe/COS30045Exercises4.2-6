<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 4.5 - D3 Binding and Drawing with Data</title>
    <!-- D3.js v7 CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .chart-title {
        color: #2c3e50;
      }
      .bar {
        transition: fill 0.3s;
      }
      .bar:hover {
        opacity: 0.8;
      }
      .label {
        font-size: 11px;
        fill: #fff;
        font-weight: bold;
        text-anchor: middle;
      }
      .x-axis-text {
        font-size: 10px;
        fill: #333;
        text-anchor: middle;
      }
    </style>
  </head>
  <body>
    <h1 class="chart-title">Exercise 4.5: Binding and Drawing with Data</h1>
    <p>Vertical Bar Chart based on CSV Data</p>

    <div id="chart"></div>

    <script>
      // CSV ဖိုင် ဖတ်ယူခြင်း
      d3.csv("tv_2026_02_15.csv")
        .then(function (data) {
          // 1. Data Processing
          data.forEach((d) => {
            d.energy = +d["Labelled energy consumption (kWh/year)"];
          });

          // ပထမဆုံး TV မော်ဒယ် ၁၂ ခုကိုသာ ရွေးဆွဲ
          const dataset = data.slice(0, 12);

          // Canvas & Chart dimensions
          const svgWidth = 600;
          const svgHeight = 300;
          const padding = 40;
          const maxEnergy = d3.max(dataset, (d) => d.energy);

          const svg = d3
            .select("#chart")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .style("background-color", "#f8f9fa");

          // 2. DATA BINDING & DRAWING BARS (<rect>)
          svg
            .selectAll("rect")
            .data(dataset) // Data Binding
            .enter()
            .append("rect")
            .attr("class", "bar")
            .attr("x", (d, i) => i * 45 + 50)
            .attr(
              "y",
              (d) => svgHeight - padding - (d.energy / maxEnergy) * 200,
            )
            .attr("width", 35)
            .attr("height", (d) => (d.energy / maxEnergy) * 200)
            // Data တန်ဖိုး ပေါ်မူတည်ပြီး dynamic အရောင်ပြောင်းအောင်လုပ်
            .attr("fill", (d) => (d.energy > 500 ? "#e74c3c" : "#3498db"));

          // 3. DRAWING VALUE LABELS (Bar ပေါ်မှ တန်ဖိုးတွေဆွဲ)
          svg
            .selectAll("text.value")
            .data(dataset)
            .enter()
            .append("text")
            .attr("class", "label")
            .attr("x", (d, i) => i * 45 + 50 + 17.5)
            .attr(
              "y",
              (d) => svgHeight - padding - (d.energy / maxEnergy) * 200 + 15,
            )
            .text((d) => Math.round(d.energy));

          // 4. DRAWING BRAND LABELS (X-Axis)
          svg
            .selectAll("text.brand")
            .data(dataset)
            .enter()
            .append("text")
            .attr("class", "x-axis-text")
            .attr("x", (d, i) => i * 45 + 50 + 17.5)
            .attr("y", svgHeight - 15)
            .text((d) => d.Brand_Reg.substring(0, 5));
        })
        .catch(function (error) {
          console.error("Error loading CSV:", error);
        });
    </script>
  </body>
</html>
